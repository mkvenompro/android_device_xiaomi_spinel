name: Extract blobs from dump

on:
  workflow_dispatch:
    inputs:
      dump_sha:
        description: GitLab dump commit SHA (branch dump-redmi-spinel-os2.0.212.0.vpgmixm)
        required: false
        default: "51a7d8118db68c9caca33756452bde31f61b9552"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: android/device/xiaomi/spinel

      - name: Clone extract-utils
        run: |
          git clone --depth 1 --branch lineage-22.2 \
            https://github.com/LineageOS/android_tools_extract-utils.git \
            android/tools/extract-utils

      - name: Clone extract-tools prebuilts
        run: |
          git clone --depth 1 \
            https://github.com/LineageOS/android_prebuilts_extract-tools.git \
            android/prebuilts/extract-tools

      - name: Install llvm toolchain for ELF checks
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          mkdir -p android/prebuilts/clang/host/linux-x86/llvm-binutils-stable
          ln -s "$(command -v llvm-objdump)" android/prebuilts/clang/host/linux-x86/llvm-binutils-stable/llvm-objdump
          ln -s "$(command -v llvm-strip)" android/prebuilts/clang/host/linux-x86/llvm-binutils-stable/llvm-strip

      - name: Download and extract dump
        run: |
          set -euo pipefail
          mkdir -p dump
          curl -L --retry 3 --fail \
            "https://gitlab.com/api/v4/projects/mkpromvp%2Fdumber-2-mk/repository/archive.tar.gz?sha=${{ inputs.dump_sha }}" \
            | tar -xz --strip-components=1 -C dump
          echo "--- dump top level ---"
          ls dump

      - name: Extract blobs
        run: |
          cd android/device/xiaomi/spinel
          # The dump has no firmware partition images (md1img/tee/lk/preloader/scp/spmfw/sspm/mcupm/pi_img/dpm/gz).
          # Disable firmware extraction on the CI checkout only, so that blob
          # extraction can complete. Firmware stays listed in
          # proprietary-firmware.txt for manual setup later.
          sed -i 's/add_firmware_proprietary_file=True,/add_firmware_proprietary_file=False,/' extract-files.py
          ./extract-files.py "$GITHUB_WORKSPACE/dump"

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-xiaomi-spinel
          path: android/vendor/xiaomi/spinel
          if-no-files-found: error
